<svg xmlns="http://www.w3.org/2000/svg" width="350" height="142" viewBox="0 0 350 142" role="img" aria-label="Most used languages">
<style>
  .t { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #fe428e; }
  .l { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9fef7; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #a9fef7; }
  .s { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #7c7a93; }
  .big { font: 800 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #fe428e; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
</style>
<rect width="350" height="142" rx="6" fill="#141321"/>
<text class="t" x="25" y="35">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="50" width="300" height="8" rx="4"/></clipPath>
<g clip-path="url(#bar)"><rect x="25.00" y="50" width="181.33" height="8" fill="#f1e05a"/><rect x="206.33" y="50" width="78.36" height="8" fill="#e34c26"/><rect x="284.69" y="50" width="39.22" height="8" fill="#663399"/><rect x="323.91" y="50" width="1.09" height="8" fill="#AA6746"/></g>
<g class="fade" style="animation-delay:200ms"><circle cx="30" cy="81" r="5" fill="#f1e05a"/>
  <text class="l" x="41" y="85">JavaScript <tspan class="s">60.4%</tspan></text></g>
<g class="fade" style="animation-delay:300ms"><circle cx="190" cy="81" r="5" fill="#e34c26"/>
  <text class="l" x="201" y="85">HTML <tspan class="s">26.1%</tspan></text></g>
<g class="fade" style="animation-delay:400ms"><circle cx="30" cy="107" r="5" fill="#663399"/>
  <text class="l" x="41" y="111">CSS <tspan class="s">13.1%</tspan></text></g>
<g class="fade" style="animation-delay:500ms"><circle cx="190" cy="107" r="5" fill="#AA6746"/>
  <text class="l" x="201" y="111">Solidity <tspan class="s">0.4%</tspan></text></g>
</svg>
